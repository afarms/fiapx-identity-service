name: fiapx-identity
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: fiapx_identity
      POSTGRES_USER: fiapx_identity
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fiapx_identity -d fiapx_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
  identity:
    build: .
    image: fiapx-identity-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fiapx_identity
      DB_USERNAME: fiapx_identity
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SERVER_PORT: "8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:?Define IDENTITY_SERVICE_KEY}
      JWT_PRIVATE_KEY: file:/run/keys/private.pem
      JWT_PUBLIC_KEY: file:/run/keys/public.pem
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    volumes:
      - ./.local/keys:/run/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
volumes:
  postgres-data:
